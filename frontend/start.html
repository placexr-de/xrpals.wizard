<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VR Room Setup</title>

    <link rel="stylesheet" href="./public/styles/main.css">

    <script type="module" src="./src/main.js" defer></script>
    <script type="module" src="./src/start.js" defer></script>
    <script type="application/javascript">
        var global = window;
    </script>
</head>
<body>
<div class="background-grid"></div>
<div class="center-wrapper">
    <div class="scan-header">
        <div class="stepper">
            <div class="step current">
                <div class="step-circle">1</div>
                <div class="step-label">Start</div>
            </div>
            <div class="step-line done"></div>
            <div class="step">
                <div class="step-circle">2</div>
                <div class="step-label">Create Virtual Room</div>
            </div>
            <div class="step-line"></div>
            <div class="step todo">
                <div class="step-circle">3</div>
                <div class="step-label">Environment Ready</div>
            </div>
        </div>
    </div>
    <div class="scan-card">
        <div class="wizard-step-header">
            <h1>Prepare Your Virtual Space!</h1>
            <p class="subtitle">
                Follow these steps to create a virtual room in mixed reality.
            </p>
        </div>
        <div class="wizard-layout one-col">
            <div class="panel">
                <div class="start-content-grid">

                    <div class="start-vr-panel">
                        <img class="vr-image" src="public/imgs/vr-headset.png" alt="VR Headset">

                        <ul class="steps">
                            <li class="done">Put on your VR glasses and open XR-PALS</li>
                            <li class="current">Look around and create the space</li>
                            <li class="todo">Finish and return to the wizard</li>
                        </ul>
                    </div>

                    <div class="reference-panel">
                        <h3>Reference Setup</h3>
                        <a href="https://www.bitcraze.io/documentation/tutorials/getting-started-with-loco-positioning-system/"
                           target="_blank">
                            <img
                                    class="reference-setup-image"
                                    src="public/imgs/reference-setup.png"
                                    alt="Reference setup using 8 anchors"
                            >
                        </a>
                    </div>
                </div>
                <div class="panel review-actions">
                    <button id="startButton" class="btn btn-primary">
                        Start
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
